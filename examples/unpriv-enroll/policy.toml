# One role, opened to unprivileged callers and restricted once they are in it.
#
# `unpriv-enroll: true` is what lets a process that is not root take this role
# through bpfjsrv. Without it the enrollment is refused and only root can ask,
# which is the default for every role that says nothing.
#
# The restrictions below:
#
#   bpf absent: the role may not call bpf(2) at all. This is what stops a shell in
#            the jail deleting its own entry from the jailer's maps and walking
#            out. `bpf-pod: true` would safely permit BPF objects from this pod,
#            but this shell does not need bpf(2) at all.
#   kill/ptrace/proc pod: process interaction and /proc access stay in the pod.
#   mq/shm pod: System V and POSIX IPC objects stay in the pod. The named POSIX
#            patterns also demonstrate narrowly shared names.
#   fs-any and verity-any: ordinary files and unsigned executables stay usable;
#            this example confines process interaction rather than the file tree.
#   exec-paths: executable code is allowed globally, but setuid execution is
#            deliberately denied. Shared objects remain usable.
#   unix-bind: pathname binds are denied and only one abstract socket name is
#            allowed, demonstrating confinement that filesystem permissions
#            cannot provide.
#   enroll absent: neither bpfjsrv nor executable xattrs may add a role, not
#            even another `sandbox` pod, so the jail cannot be widened or its
#            pod slots used up from inside.
#
[roles.sandbox]
unpriv-enroll = true
fs-any = true
verity-any = true
kill-pod = true
ptrace-pod = true
proc-pod = true
mq-sysv-pod = true
mq-posix-pod = true
shm-sysv-pod = true
shm-posix-pod = true

[[roles.sandbox.mq-posix-pattern]]
name = "/bpfj-example-*"
allow = true

[[roles.sandbox.shm-posix-pattern]]
name = "/bpfj-example-*"
allow = true

[[roles.sandbox.exec-paths]]
path = "/"
allow = true
permissions = ["exec", "shared-object"]

[[roles.sandbox.unix-bind]]
path = "/"
allow = false

[[roles.sandbox.unix-bind]]
name = "@*"
allow = false

[[roles.sandbox.unix-bind]]
name = "@bpfj-sandbox-demo"
allow = true
